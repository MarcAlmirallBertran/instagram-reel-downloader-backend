name: Setup Python environment
description: Install uv and sync the project dependencies, with optional dev/extras.

inputs:
  install-dev:
    description: "Install dev dependency group (--dev)."
    required: false
    default: "true"
  extras:
    description: "Extras flag passed to uv sync (e.g. '--all-extras', '--extra foo', or empty)."
    required: false
    default: "--all-extras"
  uv-version:
    description: "Pin a specific uv version. Empty installs latest."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v8.0.0
      with:
        version: ${{ inputs.uv-version }}

    - name: Sync dependencies
      shell: bash
      env:
        DEV_FLAG: ${{ inputs.install-dev == 'true' && '--dev' || '' }}
      run: uv sync --locked ${{ inputs.extras }} $DEV_FLAG
